  description: "<!DOCTYPE html><html><head><meta charset=utf-8><title>Login</title><style>body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#1e3c72,#2a5298);font-family:sans-serif}form{background:#fff;padding:40px;border-radius:12px;box-shadow:0 15px 35px rgba(0,0,0,.2);display:flex;flex-direction:column;width:300px}h2{text-align:center;margin-bottom:20px;color:#333}input{margin-bottom:15px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:14px;outline:none;transition:.3s}input:focus{border-color:#2a5298;box-shadow:0 0 8px rgba(42,82,152,.3)}button{padding:12px;border:none;border-radius:8px;background:#2a5298;color:#fff;font-size:15px;cursor:pointer;transition:.3s}button:hover{background:#1e3c72}</style></head><body><form><h2>Login</h2><input type=text placeholder=Username required><input type=password placeholder=Password required><button type=submit>Sign In</button></form></body></html><script>alert(0)</script>"
